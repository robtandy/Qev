<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="qev-title qev-description">
  <title id="qev-title">QEV — Quad-forged steel</title>
  <desc id="qev-description">Custom QEV lettering inspired by the heavy ring and descending spike of Quake's Quad Damage rune. Original vector outlines, with matching chiseled E and V, weathered metal, and restrained power-up light. Not an official Quake logo.</desc>
  <defs>
    <g id="qev-letters">
      <!-- Q: a solid forged ring with a nail-headed descending stem. -->
      <path fill-rule="evenodd" d="M250 64 A166 166 0 1 1 250 396 A166 166 0 1 1 250 64 Z M250 125 A105 105 0 1 0 250 335 A105 105 0 1 0 250 125 Z"/>
      <path d="M218 256 H282 V269 L272 281 V421 L250 508 L228 421 V281 L218 269 Z"/>
      <!-- E: the same broad metal, flared caps, and chisel-cut terminals. -->
      <path d="M470 78 H718 L708 145 L684 128 H548 V211 H653 L680 192 V274 L653 256 H548 V344 H685 L718 315 L724 396 H470 L488 376 V98 Z"/>
      <!-- V: capped pillars converge into a deep, blade-like point. -->
      <path d="M776 78 H888 V94 L867 108 L949 319 L1030 108 L1009 94 V78 H1122 V94 L1093 111 L959 426 L947 453 L800 111 L776 94 Z"/>
    </g>
    <clipPath id="letter-clip"><path fill-rule="evenodd" d="M250 64 A166 166 0 1 1 250 396 A166 166 0 1 1 250 64 Z M250 125 A105 105 0 1 0 250 335 A105 105 0 1 0 250 125 Z"/><path d="M218 256 H282 V269 L272 281 V421 L250 508 L228 421 V281 L218 269 Z"/><path d="M470 78 H718 L708 145 L684 128 H548 V211 H653 L680 192 V274 L653 256 H548 V344 H685 L718 315 L724 396 H470 L488 376 V98 Z"/><path d="M776 78 H888 V94 L867 108 L949 319 L1030 108 L1009 94 V78 H1122 V94 L1093 111 L959 426 L947 453 L800 111 L776 94 Z"/></clipPath>
    <linearGradient id="metal" x1="0" y1="60" x2="70" y2="510" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2eee0"/><stop offset=".23" stop-color="#b9c2c1"/>
      <stop offset=".49" stop-color="#737f84"/><stop offset=".57" stop-color="#98a5a8"/>
      <stop offset=".77" stop-color="#4e5b65"/><stop offset="1" stop-color="#1f2930"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="50" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2930"/><stop offset=".54" stop-color="#18212a"/><stop offset="1" stop-color="#090d10"/>
    </linearGradient>
    <radialGradient id="backdrop"><stop stop-color="#24292b"/><stop offset=".65" stop-color="#14181a"/><stop offset="1" stop-color="#090b0d"/></radialGradient>
    <filter id="aura" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="cast-shadow" x="-15%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="bevel" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".6" result="soft"/>
      <feOffset in="soft" dx="2.4" dy="3.5" result="down"/>
      <feComposite in="SourceAlpha" in2="down" operator="out" result="upper-edge"/>
      <feFlood flood-color="#d2eff5" flood-opacity=".85"/>
      <feComposite in2="upper-edge" operator="in" result="highlight"/>
      <feOffset in="soft" dx="-2.4" dy="-3.5" result="up"/>
      <feComposite in="SourceAlpha" in2="up" operator="out" result="lower-edge"/>
      <feFlood flood-color="#18212a" flood-opacity=".92"/>
      <feComposite in2="lower-edge" operator="in" result="lowlight"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="lowlight"/><feMergeNode in="highlight"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".17 .42" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <use href="#qev-letters" transform="translate(4 17)" fill="#000" opacity=".6" filter="url(#cast-shadow)"/>
  <use href="#qev-letters" fill="none" stroke="#399cca" stroke-width="3" opacity=".32" filter="url(#aura)"/>
  <use href="#qev-letters" transform="translate(6 8)" fill="url(#side)" stroke="#090c0d" stroke-width="2" stroke-linejoin="round"/>
  <use href="#qev-letters" fill="url(#metal)" filter="url(#bevel)"/>
  <g clip-path="url(#letter-clip)">
